<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jessica Colautti, Product Designer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..500&family=Mulish:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#FFFDFC;--ink:#1F2A63;--muted:#5B6384;--line:#E7E2EE;--accent:#FF7A45;--mint:#B8F0E3;--pink:#FBD7E7;--lav:#E3DCFA;--gray:#F3F2F5;--dark:#2B2D35;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:"Mulish",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#12162A;--ink:#EEF0FA;--muted:#A3A9C4;--line:#2A3050;--accent:#FF8A5C;--mint:#1F5E58;--pink:#5A2A4A;--lav:#3A3470;--gray:#1B203A}}
:root[data-theme="dark"]{--paper:#12162A;--ink:#EEF0FA;--muted:#A3A9C4;--line:#2A3050;--accent:#FF8A5C;--mint:#1F5E58;--pink:#5A2A4A;--lav:#3A3470;--gray:#1B203A}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.65 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:10}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
img{display:block;max-width:100%;height:auto}
.w{max-width:1120px;margin:0 auto;padding:0 28px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper)}
header .w{display:flex;justify-content:space-between;align-items:center;height:64px}
.brand{font:700 20px var(--sans);text-decoration:none}
nav a{font-size:15px;font-weight:500;text-decoration:none}nav a:hover{color:var(--accent)}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.02em;margin:0}

/* hero card, same gradient + mint orb language as the original site */
.card-hero{position:relative;overflow:hidden;margin:0 20px;border-radius:32px;background:
  radial-gradient(55% 80% at 8% 12%,color-mix(in srgb,var(--mint) 70%,transparent),transparent 65%),
  radial-gradient(45% 70% at 95% 95%,color-mix(in srgb,var(--pink) 85%,transparent),transparent 65%),
  radial-gradient(40% 60% at 72% 5%,color-mix(in srgb,var(--lav) 80%,transparent),transparent 65%),var(--paper);
  border:1px solid var(--line)}
.orb{position:absolute;border-radius:50%;background:var(--mint);width:clamp(96px,15vw,190px);aspect-ratio:1}
.home-hero{padding:96px 0 88px;min-height:560px}
.home-hero .orb{left:clamp(10px,5vw,80px);top:86px}
.home-hero .in{position:relative;padding:0 clamp(24px,6vw,90px)}
.hi{font:italic 400 clamp(24px,3vw,34px) var(--serif);margin:0 0 6px;color:var(--muted)}
.home-hero h1{font-size:clamp(56px,11.5vw,150px);line-height:.92;letter-spacing:-.04em;margin:0 0 36px}
.role{font:500 clamp(22px,3vw,34px)/1.35 var(--serif);margin:0;max-width:20em}
.role b{color:var(--accent);font-weight:500}
.yrs{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--ink);color:var(--paper);font:700 .6em var(--sans);vertical-align:.12em;margin:0 .15em}
.badge{position:absolute;right:clamp(20px,5vw,70px);bottom:36px;width:130px;height:130px}
.badge svg{width:100%;height:100%;animation:spin 22s linear infinite}
.badge .arrow{position:absolute;inset:0;display:grid;place-items:center;font-size:30px}
@keyframes spin{to{transform:rotate(360deg)}}
.sec-label{display:flex;align-items:center;gap:20px;font-weight:700;font-size:13px;letter-spacing:.18em;margin:84px 0 40px}
.sec-label::before,.sec-label::after{content:"";flex:1;height:1px;background:var(--line)}

/* project cards: staggered, pastel, same as the original grid but offset */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.card{border-radius:28px;padding:28px;background:color-mix(in srgb,var(--hue) 18%,var(--paper))}
.cards .card:nth-child(even){margin-top:80px}
.card .pic{border-radius:18px;overflow:hidden;margin-bottom:22px;aspect-ratio:16/9;background:color-mix(in srgb,var(--hue) 28%,var(--paper))}
.card .pic img{width:100%;height:100%;object-fit:cover}
.card h3{font-size:clamp(26px,3vw,34px);line-height:1.12;margin-bottom:22px}
.btn{display:inline-block;background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:8px;font-weight:700;font-size:14px;text-decoration:none}
.btn:hover{background:var(--accent);color:#fff}
.btn.soon{background:color-mix(in srgb,var(--pink) 100%,var(--ink) 20%);color:var(--paper);pointer-events:none}

/* services */
.services{margin-top:120px;padding:80px 0 96px;background:var(--gray)}
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.svc div{background:var(--paper);border-radius:20px;padding:28px}
.svc div:nth-child(2){margin-top:40px}.svc div:nth-child(3){margin-top:80px}
.svc .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;margin-bottom:16px;background:var(--lav)}
.svc div:nth-child(2) .ico{background:color-mix(in srgb,#F0A869 35%,var(--paper))}.svc div:nth-child(3) .ico{background:var(--mint)}
.svc h3{font-size:24px;margin-bottom:10px}.svc p{margin:0;color:var(--muted);font-size:16px}

/* case page */
.case-hero{padding:36px 0 56px}
.case-hero .orb{left:clamp(10px,4vw,60px);top:90px;width:clamp(70px,10vw,130px)}
.case-hero .in{position:relative;padding:0 clamp(24px,6vw,90px)}
.back{font-size:14px;font-weight:700;text-decoration:none}
.case-hero h1{font-size:clamp(38px,6.6vw,84px);line-height:1;letter-spacing:-.035em;margin:40px 0 0;max-width:12em}
.cover{margin:36px 20px 0;border-radius:28px;overflow:hidden;background:color-mix(in srgb,var(--hue) 22%,var(--paper));padding:clamp(16px,4vw,48px);display:grid;place-items:center}
.cover img{border-radius:12px;max-height:520px;width:auto}
.sum{display:grid;grid-template-columns:1.25fr 1fr;gap:56px;padding-top:80px;align-items:start}
.sum h3{font-size:28px;margin-bottom:16px}.sum p{margin:0 0 18px;max-width:34em}
.tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.tag{border:1px solid var(--ink);border-radius:6px;padding:5px 14px;font-size:14px;color:var(--ink)}
.details{background:var(--gray);border-radius:20px;padding:28px 32px;position:sticky;top:calc(88px + env(safe-area-inset-top,0px))}
.details b{display:block;font-family:var(--serif);font-weight:500;font-size:19px}.details span{display:block;margin-bottom:18px;color:var(--muted)}.details span:last-child{margin:0}
.ps{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding-top:72px}
.ps div{border-radius:24px;padding:40px}
.ps .prob{background:var(--dark);color:#fff}.ps .sol{background:var(--gray)}
.ps h3{font-size:28px;margin-bottom:14px}.ps p{margin:0}
.journey{padding-top:80px}.journey h3{font-size:30px;margin-bottom:16px}.journey p{max-width:46em;margin:0 0 18px}
.journey img{border-radius:12px;margin-top:28px;border:1px solid var(--line)}
.screens{background:var(--dark);color:#fff;margin:96px 20px 0;border-radius:28px;padding:64px clamp(20px,5vw,64px)}
.screens h2{font-size:clamp(30px,4vw,44px);margin-bottom:36px}
.shots{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;align-items:flex-start}
.shots img{border-radius:8px;background:#fff}
.next{padding:72px 0 0}.next a{text-decoration:none;display:block}
.next small{display:block;color:var(--muted);font-size:15px;margin-bottom:6px}
.next span{font:500 clamp(28px,4.4vw,52px)/1.08 var(--serif);letter-spacing:-.02em}.next a:hover span{color:var(--accent)}

/* closing: badge, marquee, contact pill, as on the original */
.outro{margin-top:96px;padding:72px 0 0;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--lav) 55%,transparent) 55%,color-mix(in srgb,var(--pink) 50%,transparent))}
.outro .badge2{position:relative;width:130px;height:130px;margin:0 auto 36px}
.outro .badge2 svg{width:100%;height:100%;animation:spin 22s linear infinite}.outro .badge2 .arrow{position:absolute;inset:0;display:grid;place-items:center;font-size:30px}
.marq{overflow:hidden;white-space:nowrap;border-block:1px solid var(--line);padding:18px 0}
.marq div{display:inline-block;animation:slide 26s linear infinite;font:400 clamp(30px,5vw,52px) var(--sans);color:var(--ink)}
.marq span{margin-right:48px}
@keyframes slide{to{transform:translateX(-50%)}}
.cta{display:flex;flex-wrap:wrap;gap:28px;justify-content:space-between;align-items:center;padding:56px 28px}
.cta .links{display:flex;flex-direction:column;gap:6px;font-family:var(--serif);font-size:20px}
.pill{background:var(--paper);border-radius:16px;padding:20px 24px;display:flex;gap:20px;align-items:center;font-family:var(--serif);font-size:20px;box-shadow:0 1px 0 var(--line)}
.pill a{background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;font:700 14px var(--sans);text-decoration:underline}
footer{border-top:1px solid var(--line);padding:22px 0 34px;font-size:14px;color:var(--muted);text-align:center}

@media (max-width:820px){
  .home-hero{padding:72px 0 120px;min-height:0}.home-hero .orb{top:48px}
  .badge{width:96px;height:96px;bottom:20px}
  .cards{grid-template-columns:1fr}.cards .card:nth-child(even){margin-top:0}
  .svc{grid-template-columns:1fr}.svc div:nth-child(n){margin-top:0}
  .sum,.ps{grid-template-columns:1fr;gap:28px}.details{position:static}
  .ps div{padding:28px}.cta{justify-content:center;text-align:center}.cta .links{align-items:center}
  .pill{flex-wrap:wrap;justify-content:center}
}
@media (prefers-reduced-motion:reduce){.badge svg,.badge2 svg,.marq div{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header><div class="w"><a class="brand" href="#home">@jcolautti</a><nav aria-label="Main"><a href="#contact">Contact</a></nav></div></header>
<main id="app"></main>
<footer>© 2026 Jessica Colautti</footer>

{id:"oil-vessel",t:"Oil Vessel Monitoring Platform",hue:"#8B7BE8",cover:"oil_cover",tags:["Designer","Creative","Website"],
 sum:["A digital platform created to support the monitoring and management of oil production vessels. It centralizes operational data, enabling efficient tracking, maintenance oversight, and better decision-making across teams."],
 prob:"Offshore operations relied on fragmented systems and manual monitoring processes, making it difficult to track vessel performance, identify operational risks, and access critical information in real time.",
 sol:"Designed a centralized monitoring platform that provides real-time visibility, performance tracking, and faster access to critical vessel data, improving decision-making and operational efficiency.",
 jt:"User Journey and User Flow",
 j:["The platform was designed to support the daily workflow of operational teams responsible for monitoring offshore oil vessels. The user journey focused on providing quick access to critical information, reducing operational complexity, and improving real-time decision-making.","Users start their journey through a centralized dashboard with a clear overview of vessel status, operational metrics, and alerts. From there, they can navigate through detailed monitoring screens, track performance indicators, identify risks, and access relevant operational data efficiently. The experience was structured to simplify complex workflows, improve visibility across operations, enhance faster responses to critical situations, ensuring a more intuitive and efficient monitoring process for different user profiles."],
 ji:[["oil_journey",1000],["oil_flow",560]],
 shots:[["oil_s1",520],["oil_s2",520],["oil_s3",520],["oil_s4",520]]},
{id:"electric-car-rental",t:"Electric Car Rental App",hue:"#F0A869",cover:"ev_cover",tags:["Designer","Creative","Mobile App"],
 sum:["Users faced difficulties finding accessible and intuitive solutions for renting electric vehicles, with booking flows often being complex and disconnected.","So we created a user-friendly mobile experience that simplifies the process of searching, booking, and managing electric vehicle rentals, making sustainable mobility more accessible and convenient."],
